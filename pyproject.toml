[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psd-fit"
version = "0.1.0"
description = "Fitting tools and PyQt6 GUI for particle-size distribution data"
authors = [
    { name = "dunbara", email = "a.dunbar@lancaster.ac.uk" },
]
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "matplotlib>=3.11.1,<4",
    "numpy>=2.5.1,<3",
    "pandas>=3.0.5,<4",
    "PyQt6>=6.11.0,<7",
    "scipy>=1.18.0,<2",
]

[project.scripts]
psdfit-gui = "psdfit.gui.RUN_HERE:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["psdfit*"]
