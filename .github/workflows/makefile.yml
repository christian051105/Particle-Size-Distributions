name: build exe

on:
  push:
    tags:
      - v*

jobs:
  build:

    runs-on: windows-latest
    
    defaults:
      run:
        shell: pwsh


    steps:
    - uses: actions/checkout@v6

    - name: List files in the repository
      run: |
        ls ${{ github.workspace }}
        
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4.1.0
      with:
          activate-environment: psdfit-dev
          environment-file: psdfit-dev.yml
          auto-activate: true
    - run: |
          conda info
          conda env list
          
    - name: test-conda
      run: |
        python -c "import sys; print(sys.executable)"
        python -c "import PyQt6; print(PyQt6.__file__)"
    - name: build-dist
      run: |
          make build
          ls ${{ github.workspace }}/dist/psdfit
          
    - name: Compile .ISS to .EXE Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: psdfit.iss
          
