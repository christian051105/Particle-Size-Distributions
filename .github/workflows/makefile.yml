name: build exe

on:
  push:
    tags:
      - v*

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: List files in the repository
      run: |
        ls ${{ github.workspace }}
        
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4.1.0
      with:
          activate-environment: psdfit-dev
          environment-file: psdfit-dev.yml
          auto-activate: false
    - run: |
          conda info
          conda list
