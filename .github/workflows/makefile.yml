name: build exe

permissions:
  contents: write


on:
  push:
    tags:
      - v*

jobs:
  build:

    runs-on: windows-latest
    
    defaults:
      run:
        shell: pwsh


    steps:
    - uses: actions/checkout@v6

    - name: List files in the repository
      run: |
        ls ${{ github.workspace }}
        
    - name: Setup Miniconda
      uses: conda-incubator/setup-miniconda@v4.1.0
      with:
          activate-environment: psdfit-dev
          environment-file: psdfit-dev.yml
          auto-activate: true
    - run: |
          conda info
          conda env list
          
    - name: test-conda
      run: |
        python -c "import sys; print(sys.executable)"
        python -c "import PyQt6; print(PyQt6.__file__)"
        
    - name: build-dist
      run: |
          make build
          ls ${{ github.workspace }}/dist/psdfit
          
    - name: Verify build
      run: |
        if (-not (Test-Path "${{ github.workspace }}/dist/psdfit/psdfit.exe")) {
          throw "Build did not produce dist/psdfit/psdfit.exe"
        }

    - name: Get release version
      id: release-version
      run: |
        $tag = '${{ github.ref_name }}'
        $version = $tag -replace '^v', ''
        if (-not $version) {
          throw "Unable to derive a release version from tag '$tag'"
        }
        "version=$version" >> $env:GITHUB_OUTPUT
        "installer=dist/PSDFit-$version-Setup.exe" >> $env:GITHUB_OUTPUT

    - name: Compile .ISS to .EXE Installer
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
      with:
        path: psdfit.iss
        options: /DMyAppVersion=${{ steps.release-version.outputs.version }}

    - name: Verify installer
      run: |
        $installer = '${{ steps.release-version.outputs.installer }}'
        if (-not (Test-Path $installer)) {
          throw "Installer was not created at $installer"
        }

    - name: Publish installer to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        files: ${{ steps.release-version.outputs.installer }}
        generate_release_notes: true
