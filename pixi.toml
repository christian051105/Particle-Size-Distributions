[workspace]
authors = ["dunbara <a.dunbar@lancaster.ac.uk>"]
channels = ["conda-forge"]
name = "gsdfit"
version = "0.1.0"
platforms = ["linux-64", "win-64"]

[tasks]
install = "pip install -e ."
gui = "gsdfit-gui"

[dependencies]
python = ">=3.14.6,<3.15"
matplotlib = ">=3.11.1,<4"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
pandas = ">=3.0.5,<4"
pyqt6 = ">=6.11.0,<7"
pip = "*"
